services:
  pi:
    image: ${CAGED_IMAGE:-caged:latest}
    build:
      context: .
      dockerfile: Containerfile
      args:
        # Pass the pi version as a build-arg (default below) so a version
        # bump rebuilds only the volatile pi layer, not the whole image.
        # Override with: PI_VERSION=x.y.z podman compose build
        PI_VERSION: ${PI_VERSION:-0.84.0}
    command: ["pi"]
    init: true                    # reap child processes (bash tool)
    read_only: true               # immutable root filesystem
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    userns_mode: keep-id
    environment:
      # Base identity.
      HOME: /agent-home
      # TUI identity — podman-compose `up` forces TERM=xterm and drops
      # size/SIGWINCH (jagged TUI); forward the host TERM + truecolor.
      TERM: ${TERM:-xterm-256color}
      COLORTERM: "truecolor"
      LANG: C.UTF-8
      # pi config home — pinned to the live seed mount so pi (and the
      # web-search tool) read their settings from the seed and persist.
      PI_CODING_AGENT_DIR: /agent-home/.pi/agent
      # --- External API credentials: secrets via env only, referenced by
      #     name from seed config (models.json) — pass at start or in an
      #     env_file; never baked into the image.
      # LLM providers.
      MY_DEEPSEEK_API_KEY: ${MY_DEEPSEEK_API_KEY:-}
      VOLCENGINE_API_KEY: ${VOLCENGINE_API_KEY:-}
      MY_OPENROUTER_API_KEY: ${MY_OPENROUTER_API_KEY:-}
      LOCAL_API_KEY: ${LOCAL_API_KEY:-}
      # GitLab (glab) — env token is primary (takes precedence, never on
      # disk); GLAB_CONFIG_DIR persists `glab auth login` on the live ~/.pi.
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_HOST: ${GITLAB_HOST:-}
      GLAB_SEND_TELEMETRY: "false"
      GLAB_CONFIG_DIR: /agent-home/.pi/agent/glab-cli
      # Jira (acli) — token via JIRA_API_TOKEN or interactive login;
      # ACLI_CONFIG_DIR on the live ~/.pi persists login state.
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      ACLI_CONFIG_DIR: /agent-home/.pi/agent/acli
      # --- Scratch & caches: rootfs is read-only and ~/.pi must stay
      #     repo-clean, so throwaway state goes to the /tmp tmpfs.
      XDG_CONFIG_HOME: /tmp/.config   # XDG fallback for other CLIs
      npm_config_cache: /tmp/.npm
      XDG_CACHE_HOME: /tmp/.cache
    working_dir: /workspace
    volumes:
      - ${CAGED_WORKSPACE:-$PWD}:/workspace:rw  # your code (default: caller's dir)
      - ${CAGED_PI_HOME:-./seed/.pi}:/agent-home/.pi:rw  # live ~/.pi: seed/.pi maps 1:1 to pi's config home (synced both ways)
      - ${CAGED_WORKSPACE:-$PWD}/sessions:/agent-home/.pi/agent/sessions  # pi sessions → per-project on host
    stdin_open: true              # -i
    tty: true                     # -t
