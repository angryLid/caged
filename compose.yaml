services:
  pi:
    image: ${CAGED_IMAGE:-caged:latest}
    build:
      context: .
      dockerfile: Containerfile
      args:
        # Pass the pi version as a build-arg (default below) so a version
        # bump rebuilds only the volatile pi layer, not the whole image.
        # Override with: PI_VERSION=x.y.z podman compose build
        PI_VERSION: ${PI_VERSION:-0.84.0}
    command: ["pi"]
    init: true                    # reap child processes (bash tool)
    read_only: true               # immutable root filesystem
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    userns_mode: keep-id
    environment:
      HOME: /agent-home
      # Point pi and the web-search/fetch tool at the live seed mount. The
      # default is ~/.pi/agent anyway, but setting it explicitly makes the
      # web-search tool read its web-search.json (ssrf.allowRanges, API keys)
      # from the seed too, so those settings persist across restarts.
      PI_CODING_AGENT_DIR: /agent-home/.pi/agent
      # pi's built-in startup profiler (core/timings.js): with PI_TIMING=1 pi
      # prints per-phase startup timings (parseArgs, session, extensions, ...)
      # to stderr when launching — handy for diagnosing the post-entrypoint
      # startup delay. Passthrough only: unset by default, no runtime cost.
      PI_TIMING: ${PI_TIMING:-}
      # pi's TUI needs a real terminal identity: podman-compose forces
      # TERM=xterm and drops the host size/SIGWINCH on `up` (jagged TUI).
      # Forward the host TERM (and truecolor), so colors render correctly.
      TERM: ${TERM:-xterm-256color}
      COLORTERM: "truecolor"
      LANG: C.UTF-8
      # Model provider keys. pi expands these $NAME references found in
      # seed/.pi/agent/models.json from the container env at runtime. Pass your
      # real values when starting, e.g.:
      #   CAGED_IMAGE=... MY_DEEPSEEK_API_KEY=sk-... podman compose up
      # or keep them in an env file (compose supports `env_file:`).
      MY_DEEPSEEK_API_KEY: ${MY_DEEPSEEK_API_KEY:-}
      VOLCENGINE_API_KEY: ${VOLCENGINE_API_KEY:-}
      MY_OPENROUTER_API_KEY: ${MY_OPENROUTER_API_KEY:-}
      LOCAL_API_KEY: ${LOCAL_API_KEY:-}
      # glab (GitLab CLI) auth — same pattern as provider keys: secrets via
      # env only, never in the repo. ~/.config sits on the read-only rootfs,
      # so point XDG_CONFIG_HOME at /tmp (scratch); with GITLAB_TOKEN set no
      # config file is needed at all.
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_HOST: ${GITLAB_HOST:-}
      GLAB_SEND_TELEMETRY: "false"
      # acli (official Atlassian CLI) — config dir on the live ~/.pi mount so
      # `acli jira auth login` state survives restarts (gitignored, like
      # auth.json). Pass the API token via JIRA_API_TOKEN (same pattern as
      # GITLAB_TOKEN) or interactively via stdin at login; never in the repo.
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      ACLI_CONFIG_DIR: /agent-home/.pi/agent/acli
      XDG_CONFIG_HOME: /tmp/.config
      # Keep home-derived caches OUT of the live .pi mount and off the rootfs:
      # only ~/.pi is a writable host mount; scratch caches go to /tmp (tmpfs).
      npm_config_cache: /tmp/.npm
      XDG_CACHE_HOME: /tmp/.cache
    working_dir: /workspace
    volumes:
      - ${CAGED_WORKSPACE:-$PWD}:/workspace:rw  # your code (default: caller's dir)
      - ${CAGED_PI_HOME:-./seed/.pi}:/agent-home/.pi:rw  # live ~/.pi: seed/.pi maps 1:1 to pi's config home (synced both ways)
      - ${CAGED_WORKSPACE:-$PWD}/sessions:/agent-home/.pi/agent/sessions  # pi sessions → per-project on host
    stdin_open: true              # -i
    tty: true                     # -t
