services:
  pi:
    image: ${CAGED_IMAGE:-caged:latest}
    command: ["pi"]
    init: true                    # reap child processes (bash tool)
    read_only: true               # immutable root filesystem
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    userns_mode: keep-id
    environment:
      HOME: /pi-agent
      # Model provider keys. pi expands these $NAME references found in
      # seed/agent/models.json from the container env at runtime. Pass your
      # real values when starting, e.g.:
      #   CAGED_IMAGE=... MY_DEEPSEEK_API_KEY=sk-... podman compose up
      # or keep them in an env file (compose supports `env_file:`).
      MY_DEEPSEEK_API_KEY: ${MY_DEEPSEEK_API_KEY:-}
      VOLCENGINE_API_KEY: ${VOLCENGINE_API_KEY:-}
      MY_OPENROUTER_API_KEY: ${MY_OPENROUTER_API_KEY:-}
      LOCAL_API_KEY: ${LOCAL_API_KEY:-}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
    working_dir: /workspace
    volumes:
      - ${CAGED_WORKSPACE:-$PWD}:/workspace:rw  # your code (default: caller's dir)
      - ${CAGED_VOLUME:-caged-pi-agent}:/pi-agent  # pi config / auth / downloaded tools (persists)
      - ${CAGED_WORKSPACE:-$PWD}/sessions:/pi-agent/.pi/agent/sessions  # pi sessions → per-project on host
    stdin_open: true              # -i
    tty: true                     # -t

volumes:
  ${CAGED_VOLUME:-caged-pi-agent}:
