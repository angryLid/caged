services:
  pi:
    image: ${CAGED_IMAGE:-caged:latest}
    build:
      context: .
      dockerfile: Containerfile
    command: ["pi"]
    init: true                    # reap child processes (bash tool)
    read_only: true               # immutable root filesystem
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    userns_mode: keep-id
    environment:
      HOME: /agent-home
      # Model provider keys. pi expands these $NAME references found in
      # seed/.pi/agent/models.json from the container env at runtime. Pass your
      # real values when starting, e.g.:
      #   CAGED_IMAGE=... MY_DEEPSEEK_API_KEY=sk-... podman compose up
      # or keep them in an env file (compose supports `env_file:`).
      MY_DEEPSEEK_API_KEY: ${MY_DEEPSEEK_API_KEY:-}
      VOLCENGINE_API_KEY: ${VOLCENGINE_API_KEY:-}
      MY_OPENROUTER_API_KEY: ${MY_OPENROUTER_API_KEY:-}
      LOCAL_API_KEY: ${LOCAL_API_KEY:-}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      # Keep home-derived caches OUT of the live .pi mount and off the rootfs:
      # only ~/.pi is a writable host mount; scratch caches go to /tmp (tmpfs).
      npm_config_cache: /tmp/.npm
      XDG_CACHE_HOME: /tmp/.cache
    working_dir: /workspace
    volumes:
      - ${CAGED_WORKSPACE:-$PWD}:/workspace:rw  # your code (default: caller's dir)
      - ${CAGED_PI_HOME:-./seed/.pi}:/agent-home/.pi:rw  # live ~/.pi: seed/.pi maps 1:1 to pi's config home (synced both ways)
      - ${CAGED_WORKSPACE:-$PWD}/sessions:/agent-home/.pi/agent/sessions  # pi sessions → per-project on host
    stdin_open: true              # -i
    tty: true                     # -t
