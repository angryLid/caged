# dsh compose stack — the single runtime entry for the DeepSeek Harness
# container (see Containerfile in this directory for the image).
#
# Usage (from the repo root):
#   podman compose -f dsh/compose.yaml build
#   podman compose -f dsh/compose.yaml up -d         # serve the Web UI
#   open http://127.0.0.1:3080
#
# Run as one-shot headless instead (no server, prints the answer and exits):
#   podman compose -f dsh/compose.yaml run --rm --no-deps dsh \
#     dsh --profile headless "explain this repo and exit"
#
# Port mapping:
#   dsh web binds 127.0.0.1:3080 by default and its CLI *rejects* --host
#   0.0.0.0. We keep that CLI guard but set the webserver config to bind
#   0.0.0.0:3080 inside the container via the home-level patch
#   (seed/.dsh/cordis.patch.yml) — the runtime schema allows it, only the flag
#   parser rejects it. The composition then publishes the HOST side to loopback
#   only (127.0.0.1), so the UI is reachable at http://127.0.0.1:3080 but is not
#   exposed to the LAN. DSH_HOST_PORT chooses the host-side port (default 3080);
#   the container port is a stable 3080.
#
# Volume mapping:
#   - ${DSH_HOME_HOST:-./seed/.dsh} -> /agent-home/.dsh  LIVE $DSH_HOME bind.
#       dsh auto-initializes profiles/, settings.yaml and the credential store
#       here on first use; our cordis.patch.yml ships in the seed and is read on
#       every boot. Config edits land on the NEXT start (no rebuild).
#   - ${CAGED_WORKSPACE:-$PWD} -> /workspace  the code dsh agents work on.

services:
  dsh:
    image: ${DSH_IMAGE:-dsh:latest}
    build:
      context: .
      dockerfile: Containerfile
      args:
        # dsh version, a build-arg like PI_VERSION so a bump rebuilds only the
        # volatile dsh layer. Override: DSH_VERSION=x.y.z podman compose build.
        DSH_VERSION: ${DSH_VERSION:-0.1.0-rc.6}
    command: ["dsh", "web"]
    init: true                    # reap child processes (dsh's bash tool)
    read_only: true               # immutable root filesystem
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    userns_mode: keep-id
    environment:
      # Base identity.
      HOME: /agent-home
      DSH_HOME: /agent-home/.dsh   # the live $DSH_HOME bind (see volumes)
      # Model credentials — dsh gives the inherited environment top (read-only)
      # precedence. dsh expects the key under DEEPSEEK_API_KEY; the operator's
      # key for pi lives under MY_DEEPSEEK_API_KEY. Map the pi var across so one
      # exported key feeds both agents (export DEEPSEEK_API_KEY too if you want
      # an independent dsh key). Never bake a real key into the repo.
      DEEPSEEK_API_KEY: ${MY_DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # --- Permission model: dsh ships its own process sandbox (bwrap/
      #     landlock/seatbelt) + interactive approval prompts. caged does NOT
      #     want them: the container itself is the sandbox (non-root uid 1000,
      #     read-only rootfs, no caps), and dsh's own confinement would fail
      #     inside a hardened read-only container anyway. `danger-full-access`
      #     is dsh's official "allow all" preset (base bundle reads this env;
      #     sandbox mode + filesystem write policy become unrestricted and the
      #     approval policy becomes 'never' — no prompts). Override only if you
      #     want dsh's own sandbox back.
      DSH_PERMISSION_MODE: ${DSH_PERMISSION_MODE:-danger-full-access}
      # --- Scratch & caches: rootfs is read-only and $DSH_HOME must stay
      #     repo-clean, so throwaway state goes to the /tmp tmpfs.
      XDG_CONFIG_HOME: /tmp/.config
      npm_config_cache: /tmp/.npm
      XDG_CACHE_HOME: /tmp/.cache
    ports:
      # Host loopback only — never expose the Web UI to the LAN.
      - 127.0.0.1:${DSH_HOST_PORT:-3080}:3080
    working_dir: /workspace
    volumes:
      - ${CAGED_WORKSPACE:-$PWD}:/workspace:rw  # your code (default: caller's dir)
      - ${DSH_HOME_HOST:-./seed/.dsh}:/agent-home/.dsh:rw  # live $DSH_HOME: <caged>/dsh/seed/.dsh maps 1:1