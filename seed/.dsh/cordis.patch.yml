# caged dsh — bind the Web UI to the container network.
#
# This is the HOME-LEVEL patch ($DSH_HOME/cordis.patch.yml), applied after every
# bundle and profile patch, so it overrides the webserver config that the
# dsh-web-app bundle inserts.
#
# Why: dsh web defaults to binding 127.0.0.1 and its CLI *rejects* `--host
# 0.0.0.0` ("would expose remote code execution to the network"). That guard
# assumes a bare `dsh web` on a user's machine. In a container the port escapes
# only through the operator's explicit publish (which we bind to the HOST
# LOOPBACK, 127.0.0.1), so binding all interfaces *inside* the container is the
# intended deployment and adds no exposure. The runtime schema accepts '0.0.0.0'
# (see @deepseek-ai/dsh-host-webserver Config); only the CLI flag parser rejects
# it, so we patch the config directly instead of passing `--host`.
#
# The port is pinned to 3080 (dsh's default) and is the CONTAINER-internal port.
# The host-side port is chosen by the operator via DSH_HOST_PORT in
# start-container.sh; changing it does not require touching this
# file. We deliberately do NOT use !!js to read DSH_PORT from the environment —
# keep the container port a stable constant and vary only the host publish.
#
# Note: the `headless` profile has no webserver row, so headless runs print a
# benign "patch named an id absent from the tree" warning to stderr. Non-fatal.
- id: webserver
  config:
    host: '0.0.0.0'
    port: 3080

# ---------------------------------------------------------------------------
# Model providers: the pi agent's seed/.pi/agent/models.json, migrated.
#
# This entry is the composition BASE for the llm-pi-ai namespace (settings
# resolve as schema defaults < this base < the user settings section), so the
# four routes below are always present. BYOK posture: configs reference keys
# by name only (apiKeyEnv, a bare POSIX identifier; pi's "$VAR" refs drop the
# $). Keys themselves are entered in the Web UI Models page and stored in
# $DSH_HOME/.credentials.yaml, resolved per request (no restart); an
# operator-injected env var of the same name shadows the file, read-only.
#
# Mapping notes vs models.json:
#   * volcengine: pi's compat flags (supportsEagerToolInputStreaming /
#     supportsStrictTools) are pi-only knobs with no dsh equivalent; the route
#     is anthropic-messages so they don't apply. Dropped.
#   * reasoning: true -> nearest dsh knob (profile reasoning: high + a known
#     compat.thinkingFormat). local-llm leaves it unset so pi-ai's baseURL
#     detection decides (pi also set no thinkingFormat there).
- id: llm-pi-ai
  config:
    providers:
      # 1:1 with models.json "DeepSeek-API".
      DeepSeek-API:
        displayName: DeepSeek API
        apiKeyEnv: MY_DEEPSEEK_API_KEY
        api: openai-completions
        baseURL: https://api.deepseek.com
        compat:
          thinkingFormat: deepseek
        reasoning: high
        models:
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash
          - id: deepseek-v4-pro
            name: DeepSeek V4 Pro Preview
      # 1:1 with models.json "volcengine".
      volcengine:
        displayName: Volcengine Ark Coding
        apiKeyEnv: VOLCENGINE_API_KEY
        api: anthropic-messages
        baseURL: https://ark.cn-beijing.volces.com/api/coding
        models:
          - id: minimax-m3
            name: minimax-m3 (Volcengine Ark Coding)
            contextWindow: 128000
            maxTokens: 16384
          - id: doubao-seed-2.1-turbo
            name: Doubao-Seed-2.1-Turbo (Volcengine Ark Coding)
            contextWindow: 128000
            maxTokens: 16384
          - id: ark-code-latest
            name: ds4f via Ark
            contextWindow: 270000
            maxTokens: 16384
      # 1:1 with models.json "my-openrouter".
      my-openrouter:
        displayName: OpenRouter
        apiKeyEnv: MY_OPENROUTER_API_KEY
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
        compat:
          thinkingFormat: openrouter
        reasoning: high
        models:
          - id: openai/gpt-5.6-luna
            name: GPT-5.6 Luna (OpenRouter)
      # 1:1 with models.json "local-llm".
      local-llm:
        displayName: Local LLM
        apiKeyEnv: LOCAL_API_KEY
        api: openai-completions
        baseURL: http://192.168.64.1:8765/v1
        models:
          - id: Coding
            name: Coding (Local)
            contextWindow: 270000
            maxTokens: 16384
          - id: Coding2
            name: Coding2 (Local)
            contextWindow: 270000
            maxTokens: 16384
          - id: gemma-4-31B
            name: Gemma 4 31B (Local)
            contextWindow: 270000
            maxTokens: 16384
          - id: qwen3.8-27b
            name: Qwen3.8 27B (Local)
            contextWindow: 270000
            maxTokens: 16384