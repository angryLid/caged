ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-default-model:
  provider: commandcode
  model: deepseek/deepseek-v4.1-flash
  reasoningEffort: medium
# Model providers: the pi agent's seed/.pi/agent/models.json, migrated (tracked).
# BYOK posture: configs reference keys by name only (apiKeyEnv, a bare POSIX
# identifier; pi's "$VAR" refs drop the $). Keys are entered in the Web UI
# Models page and stored in $DSH_HOME/.credentials.yaml, resolved per request
# (no restart); an operator-injected env var of the same name shadows the
# stored value, read-only.
# Mapping notes vs models.json:
#   * reasoning: true -> nearest dsh knob (profile reasoning level + a known
#     compat.thinkingFormat). local-llm leaves it unset so pi-ai's baseURL
#     detection decides (pi also set no thinkingFormat there).
llm-pi-ai:
  providers:
    # CommandCode GOAT plan Provider API; all DeepSeek* models on the plan.
    # Off-peak prices shown for the v4-flash family (peak 01-04 & 06-10 UTC
    # Mon-Fri bills 2x input/output). V4.1 Flash and the (exp) model take images.
    commandcode:
      displayName: CommandCode
      apiKeyEnv: COMMANDCODE_API_KEY
      api: openai-completions
      baseURL: https://api.commandcode.ai/provider/v1
      compat:
        thinkingFormat: deepseek
        supportsReasoningEffort: true
      reasoning: medium
      models:
        - id: deepseek/deepseek-v4-flash
          name: DeepSeek V4 Flash (latest)
          contextWindow: 1000000
          maxTokens: 16384
        - id: deepseek/deepseek-v4.1-flash
          name: DeepSeek V4.1 Flash
          input:
            - text
            - image
          contextWindow: 1000000
          maxTokens: 16384
          # DeepSeek's own level mapping (api-docs.deepseek.com/guides/thinking_mode):
          # off: null, minimal: low, low: low, medium: high, high: high, xhigh: high, max: max
          reasoningEfforts:
            off: null
            minimal: low
            low: low
            medium: high
            high: high
            xhigh: high
            max: max
        - id: deepseek/deepseek-v4-flash-fast
          name: DeepSeek V4 Flash Fast
          contextWindow: 1000000
          maxTokens: 16384
        - id: deepseek/deepseek-v4-flash-vision-exp
          name: DeepSeek V4 Flash Vision (exp)
          input:
            - text
            - image
          contextWindow: 1000000
          maxTokens: 16384
        - id: deepseek/deepseek-v4-pro
          name: DeepSeek V4 Pro (latest)
          contextWindow: 1000000
          maxTokens: 16384
    # 1:1 with models.json "local-llm". Vision only on Qwen3.8-flash-next;
    # GLM-5.3-Flash has vision and prefill cache disabled to free VRAM for the
    # KV cache (poor fit for RAG). contextWindow/maxTokens stay at the caged
    # 270k/16k values, below each model's advertised window.
    local-llm:
      displayName: Local LLM
      apiKeyEnv: LOCAL_API_KEY
      api: openai-completions
      baseURL: http://192.168.64.1:8765/v1
      models:
        - id: Coding
          name: Coding — DeepSeek V4 Flash (Local)
          contextWindow: 270000
          maxTokens: 16384
        - id: GLM-5.3-Flash
          name: GLM-5.3 Flash (Local)
          contextWindow: 270000
          maxTokens: 16384
        - id: Qwen3.8-flash-next
          name: Qwen3.8 Flash Next (Local)
          contextWindow: 270000
          maxTokens: 16384
agent-presets:
  default: standard
ui-theme:
  preference: light
