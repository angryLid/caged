ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-default-model:
  provider: nube
  model: DeepSeek-V4-Flash
llm-deepseek:
  baseURL: https://api.deepseek.com
# Model providers: the pi agent's seed/.pi/agent/models.json, migrated (tracked).
# BYOK posture: configs reference keys by name only (apiKeyEnv, a bare POSIX
# identifier; pi's "$VAR" refs drop the $). Keys are entered in the Web UI
# Models page and stored in $DSH_HOME/.credentials.yaml, resolved per request
# (no restart); an operator-injected env var of the same name shadows the
# stored value, read-only.
# Mapping notes vs models.json:
#   * reasoning: true -> nearest dsh knob (profile reasoning: high + a known
#     compat.thinkingFormat). local-llm leaves it unset so pi-ai's baseURL
#     detection decides (pi also set no thinkingFormat there).
llm-pi-ai:
  providers:
    # 1:1 with models.json "DeepSeek-API".
    DeepSeek-API:
      displayName: DeepSeek API
      apiKeyEnv: MY_DEEPSEEK_API_KEY
      api: openai-completions
      baseURL: https://api.deepseek.com
      compat:
        thinkingFormat: deepseek
      reasoning: high
      models:
        - id: deepseek-v4-flash
          name: DeepSeek V4 Flash
        - id: deepseek-v4-pro
          name: DeepSeek V4 Pro Preview
    # 1:1 with models.json "my-openrouter".
    my-openrouter:
      displayName: OpenRouter
      apiKeyEnv: MY_OPENROUTER_API_KEY
      api: openai-completions
      baseURL: https://openrouter.ai/api/v1
      compat:
        thinkingFormat: openrouter
      reasoning: high
      models:
        - id: openai/gpt-5.6-luna
          name: GPT-5.6 Luna (OpenRouter)
    # 1:1 with models.json "local-llm".
    local-llm:
      displayName: Local LLM
      apiKeyEnv: LOCAL_API_KEY
      api: openai-completions
      baseURL: http://192.168.64.1:8765/v1
      models:
        - id: Coding
          name: Coding (Local)
          contextWindow: 270000
          maxTokens: 16384
        - id: Coding2
          name: Coding2 (Local)
          contextWindow: 270000
          maxTokens: 16384
        - id: gemma-4-31B
          name: Gemma 4 31B (Local)
          contextWindow: 270000
          maxTokens: 16384
        - id: qwen3.8-27b
          name: Qwen3.8 27B (Local)
          contextWindow: 270000
          maxTokens: 16384
    # Nube.sh OpenAI-compatible gateway (dsh-only; not in pi's models.json).
    nube:
      displayName: Nube.sh
      apiKeyEnv: NUBE_KEY
      api: openai-completions
      baseURL: https://ai.nube.sh/api/v1
      models:
        - id: DeepSeek-V4-Flash
          name: DeepSeek V4 Flash (Nube.sh)
          contextWindow: 270000
          maxTokens: 16384
agent-presets:
  default: standard
